# git-cliff configuration for AsyncATHandler
# https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# Body template — one section per commit group
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits | unique(attribute="message") %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} in \
                [#{{ commit.remote.pr_number }}](https://github.com/ByteNana/AsyncATHandler/pull/{{ commit.remote.pr_number }})\
            {% else %}\
                ({{ commit.id | truncate(length=7, end="") }})\
            {% endif %}\
    {% endfor %}
{% endfor %}\n
"""
# Remove leading/trailing whitespace from the template output
trim = true
# Changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# Postprocessors applied to the full changelog body
postprocessors = [
    # Replace short commit hashes (fallback for commits without a PR) with GitHub links
    { pattern = '\(([a-f0-9]{7})\)', replace = "([${1}](https://github.com/ByteNana/AsyncATHandler/commit/${1}))" },
]

[remote.github]
owner = "ByteNana"
repo = "AsyncATHandler"

[git]
# Parse conventional commits
conventional_commits = true
filter_unconventional = true
# Split squash-merge commit bodies into individual entries so each
# conventional commit line from the PR is parsed separately.
split_commits = true

# Preprocessors run on each commit message before parsing.
# Strip noise from squash-merge bodies so only the conventional
# commit lines remain for the parser.
commit_preprocessors = [
    # Remove bullet prefixes added by GitHub squash-merge
    { pattern = '^\* ', replace = "" },
    { pattern = '^- ', replace = "" },
    # Remove Signed-off-by lines
    { pattern = '^Signed-off-by:.*', replace = "" },
    # Remove Co-authored-by lines
    { pattern = '^Co-authored-by:.*', replace = "" },
]

# Process each "type" into a human-friendly group header
commit_parsers = [
    { message = "^feat",     group = "🚀 Features" },
    { message = "^fix",      group = "🐛 Bug Fixes" },
    { message = "^docs",     group = "📚 Documentation" },
    { message = "^perf",     group = "⚡ Performance" },
    { message = "^refactor", group = "🔨 Refactoring" },
    { message = "^style",    group = "🎨 Style" },
    { message = "^test",     group = "🧪 Testing" },
    { message = "^ci",       group = "⚙️ CI/CD" },
    { message = "^build",    group = "📦 Build System" },
    { message = "^hotfix",   group = "🐛 Bug Fixes" },
    { message = "^project",  skip = true },
    { message = "^chore",    skip = true },
]

# Protect breaking changes
protect_breaking_commits = false
# Filter out merge commits
filter_commits = false
# Glob pattern for tags
tag_pattern = "v[0-9].*"
# Sort commits by newest first
sort_commits = "newest"
