[platformio]
test_dir = test

[env]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = googletest

build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=5
  -Ilib/BoneBuilder
  -Ilib/Mocks
  -Ilib/SerialCommunicator
  -Ilib/TestCommon

build_unflags =
  -std=gnu++11

[env:test]
lib_deps =
  google/googletest@^1.12.1
  symlink://..

[env:ci]
lib_deps =
  symlink://..
  google/googletest@^1.12.1

